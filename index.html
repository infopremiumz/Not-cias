        /* --- ESTILOS GERAIS E RESPONSIVIDADE --- */
        :root {
            --primary-color: #d32f2f;
            --dark-color: #1a1a1a;
            --light-color: #f4f4f4;
            --text-color: #333;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Roboto', sans-serif;
        }

        body {
            background-color: var(--light-color);
            color: var(--text-color);
            line-height: 1.6;
        }

        header {
            background-color: var(--dark-color);
            color: white;
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 1rem;
        }

        .logo h1 {
            color: white;
            cursor: pointer;
            font-size: 1.8rem;
        }

        .logo span {
            color: var(--primary-color);
        }

        /* Barra de Pesquisa com Lupa */
        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            padding: 0.5rem 2rem 0.5rem 0.7rem;
            border-radius: 4px;
            border: none;
            outline: none;
            width: 250px;
            transition: width 0.3s;
        }

        .search-box input:focus {
            width: 300px;
        }

        .search-box i {
            position: absolute;
            right: 10px;
            color: #666;
            cursor: pointer;
        }

        /* --- NAVEGAÇÃO / SEPARADORES --- */
        nav {
            background-color: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .nav-tabs {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            list-style: none;
        }

        .nav-tabs li {
            padding: 1rem 1.5rem;
            cursor: pointer;
            font-weight: bold;
            border-bottom: 3px solid transparent;
            transition: 0.2s;
        }

        .nav-tabs li:hover, .nav-tabs li.active {
            border-bottom: 3px solid var(--primary-color);
            color: var(--primary-color);
        }

        /* --- ESPAÇOS DE PUBLICIDADE (REQUISITO ADSENSE) --- */
        .ad-space {
            max-width: 1200px;
            margin: 1rem auto;
            background: #e0e0e0;
            border: 1px dashed #999;
            text-align: center;
            padding: 15px;
            font-size: 0.8rem;
            color: #666;
        }

        /* --- FEED DE NOTÍCIAS --- */
        main {
            max-width: 1200px;
            margin: 0 auto;
            padding: 1rem;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .news-card {
            background: white;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: transform 0.2s;
            cursor: pointer;
        }

        .news-card:hover {
            transform: translateY(-5px);
        }

        .news-card img {
            width: 100%;
            height: 200px;
            object-fit: cover;
        }

        .news-content {
            padding: 1rem;
        }

        .news-category {
            font-size: 0.75rem;
            text-transform: uppercase;
            color: var(--primary-color);
            font-weight: bold;
        }

        .news-title {
            font-size: 1.2rem;
            margin: 0.5rem 0;
            color: var(--dark-color);
        }

        .news-summary {
            font-size: 0.9rem;
            color: #555;
        }

        /* --- CAIXAS DE DIÁLOGO (MODAIS) --- */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.7);
            z-index: 1000;
            justify-content: center;
            align-items: center;
            padding: 1rem;
        }

        .modal-content {
            background: white;
            max-width: 700px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            border-radius: 8px;
            padding: 2rem;
            position: relative;
        }

        .close-modal {
            position: absolute;
            top: 15px;
            right: 20px;
            font-size: 1.5rem;
            cursor: pointer;
            color: #333;
        }

        .modal-body img {
            width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 6px;
            margin-bottom: 1rem;
        }

        /* --- RODAPÉ --- */
        footer {
            background-color: var(--dark-color);
            color: white;
            text-align: center;
            padding: 2rem 1rem;
            margin-top: 3rem;
        }

        .footer-links {
            margin-bottom: 1rem;
        }

        .footer-links a {
            color: #bbb;
            text-decoration: none;
            margin: 0 10px;
            cursor: pointer;
        }

        .footer-links a:hover {
            color: white;
        }

        /* --- RESPONSIVIDADE ADICIONAL PARA TELEMÓVEIS --- */
        @media (max-width: 600px) {
            .header-container {
                flex-direction: column;
            }
            .search-box, .search-box input {
                width: 100%;
            }
            .search-box input:focus {
                width: 100%;
            }
            .nav-tabs {
                justify-content: space-around;
            }
            .nav-tabs li {
                padding: 0.8rem 0.5rem;
                font-size: 0.9rem;
            }
        }
    </style>
</head>

                card.className = 'news-card';
                
                card.onclick = () => openNewsDetails(news.id);

                card.innerHTML = `
                    <img src="${news.image}" alt="${news.title}">
                    <div class="news-content">
                        <span class="news-category">${news.category}</span>
                        <h2 class="news-title">${news.title}</h2>
                        <p class="news-summary">${news.summary}</p>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        // --- SISTEMA DE SEPARADORES (FILTRO) ---
        function filterCategory(category, element) {
            currentCategory = category;
            
            // Atualizar classe ativa no menu
            document.querySelectorAll('.tab-item').forEach(tab => tab.classList.remove('active'));
            element.classList.add('active');

            applyFilterAndSearch();
        }

        // --- BARRA DE PESQUISA COM LUPA ---
        function searchNews() {
            applyFilterAndSearch();
        }

        // Combina o filtro do separador ativo com o texto pesquisado
        function applyFilterAndSearch() {
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            
            const filtered = newsData.filter(news => {
                const matchesCategory = (currentCategory === 'todos' || news.category === currentCategory);
                const matchesSearch = news.title.toLowerCase().includes(searchText) || news.summary.toLowerCase().includes(searchText);
                return matchesCategory && matchesSearch;
            });

            renderNews(filtered);
        }

        // --- CONTROLO DAS CAIXAS DE DIÁLOGO (MODAIS) ---
        function openModal(type) {
            const modal = document.getElementById('globalModal');
            const body = document.getElementById('modalBody');
            
            body.innerHTML = legalTexts[type];
            modal.style.display = 'flex';
        }

        function openNewsDetails(id) {
            const modal = document.getElementById('globalModal');
            const body = document.getElementById('modalBody');
            const news = newsData.find(item => item.id === id);

            if(news) {
                body.innerHTML = `
                    <span class="news-category" style="display:block; margin-bottom:0.5rem;">${news.category}</span>
                    <h2 style="margin-bottom:1rem; color:var(--dark-color);">${news.title}</h2>
                    <img src="${news.image}" alt="${news.title}" style="width:100%; max-height:350px; object-fit:cover; border-radius:6px; margin-bottom:1rem;">
                    <div style="margin-top:1rem; font-size:1.05rem;">${news.details}</div>
                    
                 
                `;
                modal.style.display = 'flex';
            }
        }

        function closeModal() {
            document.getElementById('globalModal').style.display = 'none';
        }

        // Fechar a caixa de diálogo se clicar fora do conteúdo branco
        window.onclick = function(event) {
            const modal = document.getElementById('globalModal');
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }

        // Executar a primeira renderização ao carregar a página
        renderNews(newsData);
    </script>
  
  
  
    
  
</bodysc/html>
